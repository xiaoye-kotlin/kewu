[versions]
agp = "8.10.1"
androidToolsSdk = "35.0.0"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.7.3"
ktor = "2.3.12"
coui = "1.1.0"
lettuce = "6.4.0.RELEASE"
obs = "3.25.10"

androidxLifecycle = "2.8.4"
androidxActivityCompose = "1.10.1"
# 扫码签到：CameraX 预览 + ML Kit 条码识别（仅 androidMain 依赖）
androidxCamera = "1.3.4"
mlkitBarcode = "17.3.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
coui-blur = { module = "io.github.suqi8.coui.kmp:coui-blur", version.ref = "coui" }
# coui 官方控件库（Checkbox / Card / Switch 等，用户要求：不自造控件，直接用 coui 原生组件）
coui-ui = { module = "io.github.suqi8.coui.kmp:coui-ui", version.ref = "coui" }
# coui 设置行组件（ArrowPreference / SwitchPreference / RadioButtonPreference 等，2026-10-23 全局 coui 化）
coui-preference = { module = "io.github.suqi8.coui.kmp:coui-preference", version.ref = "coui" }
# coui 官方图标（返回 / 编辑 / 发送 / 麦克风等，替换自绘 Canvas 小图标）
coui-icons = { module = "io.github.suqi8.coui.kmp:coui-icons", version.ref = "coui" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidxCamera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }


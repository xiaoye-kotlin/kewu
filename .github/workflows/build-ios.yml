name: Build iOS IPA

# §90：用 GitHub Actions 在 macOS runner 上编译 IPA（Windows 本地无法编 iOS）。
# 省额度策略：只在手动触发时跑（workflow_dispatch），不监听 push/PR；macos-latest 为 ARM runner，
# 与 iosArm64 目标一致、编译最快；Gradle 依赖与构建缓存命中后通常几分钟内完成。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            composeApp/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec iosApp/project.yml --project iosApp/Kewu.xcodeproj

      # ad-hoc 签名：无开发者证书也能产出可分发 IPA（安装需重签或开发者设备）。
      - name: Archive (ad-hoc, no signing)
        working-directory: iosApp
        run: |
          xcodebuild -project Kewu.xcodeproj -scheme Kewu \
            -configuration Release -sdk iphoneos \
            -archivePath $PWD/build/Kewu.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Export IPA
        working-directory: iosApp
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/Kewu.xcarchive \
            -exportPath $PWD/build/ipa \
            -exportOptionsPlist $PWD/../exportOptions-adhoc.plist \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kewu-ios-adhoc
          path: iosApp/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

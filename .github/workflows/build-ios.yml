name: Build iOS IPA

# §90：用 GitHub Actions 在 macOS runner 上编译 IPA（Windows 本地无法编 iOS）。
# 省额度策略：只在手动触发时跑（workflow_dispatch），不监听 push/PR；macos-latest 为 ARM runner，
# 与 iosArm64 目标一致、编译最快；Gradle 依赖与构建缓存命中后通常几分钟内完成。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # Kotlin/Native 的 linkReleaseFrameworkIosArm64 很吃内存，runner 默认堆会在链接阶段 OOM。
      GRADLE_OPTS: -Xmx2g -XX:MaxMetaspaceSize=1g
      KOTLIN_DAEMON_OPTIONS: -Xmx5g -XX:MaxMetaspaceSize=2g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            composeApp/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      # 兜底：即便索引权限位出错，也保证 Xcode Run Script 里的 ./gradlew 可执行。
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate Xcode project
        # project.yml 在 iosApp/ 下，XcodeGen 默认在 spec 同目录生成 iosApp/Kewu.xcodeproj
        run: xcodegen generate --spec iosApp/project.yml

      # 仓库没有任何 Apple 开发者证书 / 描述文件，archive 阶段必须彻底关掉签名。
      # 这样得到的是未签名 App，可在有证书的 Mac 上重签后安装；见交接文档 §90。
      - name: Archive (unsigned)
        working-directory: iosApp
        run: |
          xcodebuild -project Kewu.xcodeproj -scheme Kewu \
            -configuration Release -sdk iphoneos \
            -archivePath $PWD/build/Kewu.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean archive

      # 优先走 ad-hoc 导出；无证书时 exportArchive 必然失败，此时直接从归档里
      # 取 .app 按 IPA 目录结构打包，保证一次 runner 运行就能拿到交付物。
      - name: Export IPA
        working-directory: iosApp
        run: |
          set +e
          xcodebuild -exportArchive \
            -archivePath $PWD/build/Kewu.xcarchive \
            -exportPath $PWD/build/ipa \
            -exportOptionsPlist $PWD/../exportOptions-adhoc.plist \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          EXPORT_RC=$?
          if [ $EXPORT_RC -ne 0 ] || ! ls $PWD/build/ipa/*.ipa >/dev/null 2>&1; then
            echo "exportArchive unavailable without signing assets, packaging unsigned IPA instead"
            mkdir -p $PWD/build/ipa/Payload
            cp -R $PWD/build/Kewu.xcarchive/Products/Applications/Kewu.app $PWD/build/ipa/Payload/
            (cd $PWD/build/ipa && zip -qry Kewu-1.0.5.ipa Payload)
          fi
          ls -lh $PWD/build/ipa/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kewu-ios-adhoc
          path: iosApp/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

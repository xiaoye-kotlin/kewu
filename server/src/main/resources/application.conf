ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.kewu.server.ApplicationKt.module ]
    }
}

app {
    storage {
        # 开发用 local（存本地磁盘），上华为云改成 obs
        mode = "obs"
        localDir = "./uploads"
    }
    obs {
        endpoint = "https://obs.cn-north-4.myhuaweicloud.com"
        bucket = "kewu2"
        # ak/sk 走环境变量 OBS_AK / OBS_SK，别写死在这里
        ak = ${?OBS_AK}
        sk = ${?OBS_SK}
        region = "cn-north-4"
    }
    redis {
        host = "127.0.0.1"
        port = 6379
        password = ${?REDIS_PASSWORD}
    }
}

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1e4b">
        <animate attributeName="stop-color" values="#0b1e4b;#123a8f;#0b1e4b" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1450c8">
        <animate attributeName="stop-color" values="#1450c8;#2f7bf0;#1450c8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#081231">
        <animate attributeName="stop-color" values="#081231;#0b2a6b;#081231" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fd4ff" stop-opacity="0.55">
        <animate attributeName="stop-opacity" values="0.55;0.15;0.55" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7fd4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9fd8ff">
        <animate attributeName="stop-color" values="#9fd8ff;#ffffff;#9fd8ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="28" fill="url(#bg)"/>
  <rect width="880" height="240" rx="28" fill="none" stroke="#5ea8ff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- breathing glow behind title -->
  <ellipse cx="440" cy="110" rx="300" ry="80" fill="url(#glow)">
    <animate attributeName="rx" values="300;340;300" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating dots -->
  <circle cx="120" cy="60" r="3" fill="#8fd0ff">
    <animate attributeName="cy" values="60;48;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="70" r="4" fill="#bfe6ff">
    <animate attributeName="cy" values="70;82;70" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.25;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="180" r="2.5" fill="#8fd0ff">
    <animate attributeName="cy" values="180;168;180" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="185" r="2.5" fill="#bfe6ff">
    <animate attributeName="cy" values="185;195;185" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- open book, gentle float -->
  <g transform="translate(440 92)">
    <animateTransform attributeName="transform" type="translate" values="440 92;440 86;440 92" dur="5s" repeatCount="indefinite" additive="replace"/>
    <path d="M-46 26 Q-23 8 0 22 Q23 8 46 26 L46 32 Q23 16 0 29 Q-23 16 -46 32 Z" fill="#cfe9ff" opacity="0.95"/>
    <path d="M-46 32 Q-23 16 0 29 Q23 16 46 32 L46 38 Q23 23 0 35 Q-23 23 -46 38 Z" fill="#8fc4ff" opacity="0.8"/>
    <!-- AI cloud -->
    <ellipse cx="0" cy="-6" rx="20" ry="13" fill="#eaf6ff"/>
    <ellipse cx="-12" cy="0" rx="10" ry="8" fill="#eaf6ff"/>
    <ellipse cx="12" cy="0" rx="10" ry="8" fill="#eaf6ff"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="12" fill="#1450c8">AI</text>
    <!-- sound waves pulsing -->
    <g stroke="#9fd8ff" stroke-width="2.5" stroke-linecap="round">
      <line x1="-62" y1="-4" x2="-62" y2="4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-56" y1="-8" x2="-56" y2="8">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="56" y1="-4" x2="56" y2="4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="62" y1="-8" x2="62" y2="8">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- title -->
  <text x="440" y="168" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="700" font-size="40" fill="url(#txt)">课悟 · Kewu</text>
  <text x="440" y="200" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#bcd9ff" opacity="0.9">基于华为云的多端协同 AI 课堂增效系统</text>
  <text x="440" y="222" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="4" fill="#7fb4f5">山城之课 · 智慧之悟</text>
</svg>
